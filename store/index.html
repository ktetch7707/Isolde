<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Isolde Store</title>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(145deg,#16223c,#080d19);color:#f8fafc;font:16px system-ui,sans-serif;min-height:100vh;padding:44px 60px}
    header{display:flex;align-items:baseline;gap:22px}
    h1{font-size:40px;letter-spacing:.16em;margin:0}
    .badge{color:#d59b61;letter-spacing:.12em}
    .intro{color:#9eabc1;margin:10px 0 12px}
    .search{display:inline-flex;gap:10px;align-items:center;border:1px solid #30415f;background:#111a2d;border-radius:999px;padding:9px 16px;margin:0 0 18px;color:#b9c7de}
    .search b{color:#f8fafc}
    .apps{display:grid;gap:9px}
    .app{display:grid;grid-template-columns:65px 1fr 145px;align-items:center;gap:16px;background:#141e32;border:1px solid #2a3852;border-radius:14px;padding:12px 17px;min-height:92px}
    .app.selected{background:#293957;border:3px solid #f8fafc;padding:10px 15px}
    .icon{width:58px;height:58px;border-radius:15px;display:grid;place-items:center;font-size:25px;font-weight:800}
    .name{font-size:22px;font-weight:700}
    .desc{color:#aab5c9;margin:2px 0}
    .meta{font-size:11px;color:#7e8da9;letter-spacing:.09em}
    .mode,.action,.state{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:999px;background:#24344f;color:#b9c7de}
    .mode.desktop-bridge{background:#503725;color:#ffd49c}
    .state.needs-setup{background:#5b3d1f;color:#ffd49c}
    .state.ready{background:#1f4632;color:#a7f3d0}
    .state.failed{background:#5f2525;color:#fecaca}
    .action{margin-top:5px;margin-left:0;margin-right:6px;background:#1f3f46;color:#a7f3d0}
    .source{font-size:11px;color:#d4b28d;margin-top:2px}
    .setup{font-size:12px;color:#ffd49c;margin-top:4px}
    .failure{font-size:12px;color:#fecaca;margin-top:4px}
    .install{border:0;border-radius:22px;padding:13px;color:white;background:#d58a45;font-weight:800}
    .installed{background:#35435a}
    .install.ready{background:#1f7a4d}
    .install.failed{background:#9f2f2f}
    .empty{border:1px dashed #43536e;border-radius:18px;padding:42px;color:#9eabc1;text-align:center}
    .help{position:fixed;bottom:12px;color:#73819b}
  </style>
</head>
<body>
  <header><h1>APP STORE</h1><span class="badge">CHROMIUM PREVIEW</span></header>
  <p class="intro">Real applications and Isolde packages. Native code controls installation, setup state, and recovery.</p>
  <div class="search">Search: <b id="query">All apps</b></div>
  <main class="apps" id="apps"></main>
  <div class="help">← Search &nbsp;&nbsp; → Clear &nbsp;&nbsp; ↑ ↓ Browse &nbsp;&nbsp; ENTER Install / Set Up / Uninstall &nbsp;&nbsp; ESC Back</div>
  <script>
    let catalog = null, selected = 0, entries = [], query = '';
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function modeLabel(mode){return mode==='desktop-bridge'?'DESKTOP FALLBACK':mode==='web-kiosk'?'WEB KIOSK':mode==='media'?'MEDIA':mode==='capture'?'CAPTURE':mode==='game-hub'?'GAME HUB':mode==='game'?'GAME':mode==='disc-media'?'DISC MEDIA':mode==='disc-game'?'DISC GAME':mode==='utility-desktop'?'UTILITY DESKTOP':'NATIVE TV'}
    function networkLabel(req){return req==='internet'?'INTERNET':req==='local-network'?'LOCAL NETWORK':'LOCAL'}
    function actionLabel(action){return action==='open-folder'?'OPENS FOLDERS':action==='open-file'?'OPENS FILES':action==='open-url'?'OPENS URLS':action==='open-disc'?'OPENS DISCS':String(action).toUpperCase()}
    function stateLabel(e){return e.state==='needs-setup'?'NEEDS SETUP':e.state==='ready'?'READY':e.state==='failed'?'FAILED':'AVAILABLE'}
    function buttonLabel(e){return e.state==='needs-setup'?'SET UP':e.state==='failed'?'RETRY SETUP':e.state==='ready'?'UNINSTALL':e.installed?'UNINSTALL':'INSTALL'}
    function actionBadges(e){const actions=e.handledActions||[];return actions.length?`<div>${actions.map(a=>`<span class="action">${esc(actionLabel(a))}</span>`).join('')}</div>`:''}
    function matches(e){const q=query.trim().toLowerCase();return !q||[e.name,e.description,e.category,e.publisher,e.presentationMode,e.networkRequirement,e.state,...(e.handledActions||[])].some(v=>String(v??'').toLowerCase().includes(q))}
    function render(){
      entries = (catalog ? catalog.entries : []).filter(matches);
      selected = Math.max(0, Math.min(selected, entries.length - 1));
      document.getElementById('query').textContent = query.trim() ? query : 'All apps';
      document.getElementById('apps').innerHTML = entries.length ? entries.map((e,i)=>`
        <article class="app ${i===selected?'selected':''}" data-i="${i}">
          <div class="icon" style="background:${esc(e.accent)}">${esc(e.symbol||'+')}</div>
          <div>
            <div class="name">${esc(e.name)}</div>
            <div class="desc">${esc(e.description)}</div>
            <div class="meta">${esc(String(e.category).toUpperCase())} &middot; ${esc(e.version)} &middot; ${esc(e.publisher)} &middot; ${esc(networkLabel(e.networkRequirement))}
              <span class="mode ${esc(e.presentationMode)}">${esc(modeLabel(e.presentationMode))}</span>
              <span class="state ${esc(e.state)}">${esc(stateLabel(e))}</span>
            </div>
            ${actionBadges(e)}
            ${e.profileIsolation==='private-native'?'<div class="source">Private app data per profile. First use requires a separate sign-in; unsupported native launchers are blocked.</div>':''}
            ${e.state==='needs-setup'&&e.setupPrompt?`<div class="setup">Setup: ${esc(e.setupPrompt)}</div>`:''}
            ${e.state==='failed'&&e.failureReason?`<div class="failure">${esc(e.failureReason)}</div>`:''}
            ${e.provenance?`<div class="source">Source: ${esc(e.provenance)}</div>`:''}
          </div>
          <button class="install ${esc(e.state)} ${e.installed?'installed':''}" data-id="${esc(e.id)}">${esc(buttonLabel(e))}</button>
        </article>`).join('') : `<section class="empty">No packages match “${esc(query)}”. Press ← to search again or → to clear.</section>`;
      document.querySelectorAll('.app').forEach(x=>x.onclick=()=>{selected=+x.dataset.i;render()});
      document.querySelectorAll('button').forEach(x=>x.onclick=ev=>{ev.stopPropagation();activate(x.dataset.id)});
      document.querySelector('.selected')?.scrollIntoView({block:'nearest'});
    }
    function activate(id){
      const e = entries.find(x=>x.id===id);
      if (!e || !catalog) return;
      if (e.state === 'needs-setup' || e.state === 'failed') catalog.completeSetup(id);
      else if (e.installed) catalog.uninstall(id);
      else catalog.install(id);
    }
    window.isoldeMove = d => { selected = Math.max(0, Math.min(entries.length - 1, selected + d)); render(); };
    window.isoldeActivate = () => entries[selected] && activate(entries[selected].id);
    window.isoldeSetSearch = text => { query = String(text ?? ''); selected = 0; render(); };
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp') { e.preventDefault(); window.isoldeMove(-1); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); window.isoldeMove(1); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); window.isoldeActivate(); }
    });
    new QWebChannel(qt.webChannelTransport, c => {
      catalog = c.objects.appCatalog;
      catalog.entriesChanged.connect(render);
      render();
    });
  </script>
</body>
</html>
