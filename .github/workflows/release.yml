name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Ubuntu 26.04
        run: |
          source /etc/os-release
          if [ "${ID}" != "ubuntu" ] || [ "${VERSION_ID}" != "26.04" ]; then
            echo "::error::Release builds require Ubuntu 26.04, got ${ID} ${VERSION_ID}"
            exit 1
          fi
          echo "ARCH=$(dpkg --print-architecture)" >> $GITHUB_ENV

      - name: Verify release signing identity
        env:
          ISOLDE_SIGNING_KEY: ${{ secrets.ISOLDE_SIGNING_KEY }}
        shell: bash
        run: |
          if [[ -z "$ISOLDE_SIGNING_KEY" ]]; then
            echo "::error::The ISOLDE_SIGNING_KEY secret is required."
            exit 1
          fi
          actual=$(printf '%s\n' "$ISOLDE_SIGNING_KEY" | openssl pkey -pubout -outform DER | sha256sum)
          expected=$(openssl pkey -pubin -in tools/isolde-signing-key.pub -outform DER | sha256sum)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::The signing secret does not match the public key shipped with Isolde."
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev \
            qt6-multimedia-dev qt6-serialport-dev qt6-webengine-dev qt6-webchannel-dev \
            libqt6sql6-sqlite \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtqml-workerscript qml6-module-qtwebengine qml6-module-qtwebchannel \
            qml6-module-qtquick-dialogs qml6-module-qtmultimedia \
            bubblewrap dbus-daemon libglib2.0-bin python3 python3-gi gir1.2-nm-1.0 pkexec xvfb libxtst6 \
            network-manager pulseaudio-utils wireplumber pipewire-pulse wmctrl \
            kodi gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-gl \
            dpkg-dev

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel "$(nproc)"

      - name: Run test suite
        run: |
          mkdir -p "$ISOLDE_TEST_ARTIFACTS"
          ctest --test-dir build --output-on-failure -j "$(nproc)"
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          ISOLDE_TEST_ARTIFACTS: ${{ runner.temp }}/isolde-test-artifacts

      - name: Build appliance payload tarball
        id: appliance
        run: |
          VERSION=$(cat VERSION)
          ARCH="${{ env.ARCH }}"
          rm -rf appliance-stage
          cmake --install build --prefix appliance-stage
          tar -czf "isolde-${VERSION}-linux-${ARCH}.tar.gz" -C appliance-stage .
          SIZE=$(stat -c %s "isolde-${VERSION}-linux-${ARCH}.tar.gz")
          SHA256=$(sha256sum "isolde-${VERSION}-linux-${ARCH}.tar.gz" | cut -d' ' -f1)
          echo "artifact=isolde-${VERSION}-linux-${ARCH}.tar.gz" >> $GITHUB_OUTPUT
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build desktop .deb package
        id: deb
        run: |
          python3 tools/build-desktop-deb.py --build-dir build --output-dir dist
          ls -la dist/

      - name: Sign appliance payload and update manifest
        env:
          ISOLDE_SIGNING_KEY: ${{ secrets.ISOLDE_SIGNING_KEY }}
        shell: bash
        run: |
          umask 077
          key_file=$(mktemp "$RUNNER_TEMP/isolde-signing-key.XXXXXXXX")
          trap 'rm -f -- "$key_file"' EXIT
          printf '%s\n' "$ISOLDE_SIGNING_KEY" > "$key_file"
          unset ISOLDE_SIGNING_KEY
          VERSION="${{ steps.appliance.outputs.version }}"
          ARCH="${{ env.ARCH }}"
          python3 tools/sign-release.py \
            --payload appliance-stage \
            --private-key "$key_file" \
            --public-key appliance-stage/share/isolde/isolde-signing-key.pub \
            --output-signature "isolde-${VERSION}-linux-${ARCH}.tar.gz.sig"
          SIZE="${{ steps.appliance.outputs.size }}"
          SHA256="${{ steps.appliance.outputs.sha256 }}"
          FILENAME="isolde-${VERSION}-linux-${ARCH}.tar.gz"
          python3 tools/sign-release.py --build-manifest \
            --version "${VERSION}" \
            --arch "${ARCH}" \
            --filename "${FILENAME}" \
            --size "${SIZE}" \
            --sha256 "${SHA256}" \
            --type appliance \
            --private-key "$key_file" \
            --public-key appliance-stage/share/isolde/isolde-signing-key.pub \
            --output-manifest update-manifest.json \
            --output-signature update-manifest.sig

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Isolde ${{ steps.appliance.outputs.version }}
          draft: false
          prerelease: false
          files: |
            isolde-*-linux-*.tar.gz
            isolde-*-linux-*.tar.gz.sig
            dist/isolde_*.deb
            update-manifest.json
            update-manifest.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
