<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <listen>unix:dir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <!-- Only processes inside this app's private filesystem can reach this bus.
       Do not include host bus policies, activation directories, or keyrings.
       AppArmor policy queries need writable securityfs, deliberately absent
       here. This setting affects only this private bus, never the host policy. -->
  <apparmor mode="disabled"/>
  <policy context="default">
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
    <allow own="*"/>
  </policy>
</busconfig>
